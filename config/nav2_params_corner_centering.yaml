################################################
# local planner
# ###############################################
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0             # controller_server가 초당 cmd_vel을 계산하는 횟수
    odom_topic: /fastlio2/lio_odom         # TEB/velocity_smoother가 참조하는 로봇 odom
    transform_tolerance: 5.0               # TF 시간 오차 허용치. localization timestamp가 흔들릴 때 여유를 줌
    min_x: -10.0
    max_x: 10.0
    min_y: -10.0
    max_y: 10.0
    min_theta_velocity_threshold: 0.25     # 이보다 작은 회전속도는 controller 내부에서 0에 가깝게 취급
    min_x_velocity_threshold: 0.001        # 이보다 작은 전진속도는 0에 가깝게 취급
    min_y_velocity_threshold: 0.001        # 코너에서 아주 작은 lateral 회피 명령도 살릴 수 있게 함

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05       # 이 거리 이상 움직이면 진행 중이라고 판단
      movement_time_allowance: 600.0       # 이 시간 동안 못 움직이면 stuck 처리

    general_goal_checker:
      stateful: True                       # 한번 goal tolerance 안에 들어가면 상태를 유지
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5               # 목표점 반경 허용오차. 0.5m 안에 들어오면 도착 가능
      yaw_goal_tolerance: 1.57             # 목표 헤딩 허용오차. 1.57rad는 약 90도라 방향을 빡빡하게 안 맞춤

      
    # ----------------------------------------------------
    # TEB local planner
    # ----------------------------------------------------
    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"
      odom_topic: /fastlio2/lio_odom

      teb_autosize: true                   # 경로 길이에 맞춰 TEB trajectory sample 수를 자동 조절
      dt_ref: 0.3                          # trajectory 시간 간격 목표값. 작을수록 촘촘하지만 계산량 증가
      dt_hysteresis: 0.1                   # dt_ref 주변에서 sample 추가/삭제가 출렁이지 않게 하는 여유값
      min_samples: 3                       # TEB trajectory 최소 pose 개수
      max_samples: 500                     # TEB trajectory 최대 pose 개수
      global_plan_overwrite_orientation: true # global path의 pose 방향을 TEB가 덮어쓸지 여부
      allow_init_with_backwards_motion: false  # 초기 궤적을 후진으로 시작하는 것을 허용할지 여부
      max_global_plan_lookahead_dist: 2.4  # TEB가 global path를 앞쪽으로 얼마나 볼지. 장애물을 더 멀리서 보고 회피
      global_plan_viapoint_sep: 0.15       # 코너에서 global path 중앙선을 더 촘촘히 따라가게 함
      via_points_ordered: true             # via-point 순서를 global path 순서대로 유지
      global_plan_prune_distance: 1.0      # 로봇 뒤쪽 global path를 잘라내는 거리
      exact_arc_length: false              # 궤적 길이를 정확 계산할지 여부. false가 가벼움
      feasibility_check_no_poses: 3        # 앞쪽 몇 개 pose를 충돌 검사할지. 장애물 앞에서 더 일찍 반응
      control_look_ahead_poses: 2          # cmd_vel 계산 시 몇 번째 앞 pose를 볼지. 회피 후 정렬 반응을 빠르게 함
      publish_feedback: true              # /teb_feedback publish 여부

      max_vel_x: 0.8                       # TEB가 허용하는 최대 전진속도
      max_vel_x_backwards: 0.02            # 최대 후진속도. 거의 후진 금지에 가까움
      max_vel_y: 0.2                       # Go2 lateral 이동을 조금 허용해 코너에서 중앙 유지/회피 여유 확보
      max_vel_theta: 0.8                   # 최대 회전속도
      acc_lim_x: 0.25                      # 전진 가속도 제한
      acc_lim_y: 0.2                       # lateral 이동을 급하지 않게 제한
      acc_lim_theta: 0.45                  # 회전 가속도 제한

      footprint_model:
        type: "polygon"
        vertices: "[[0.40, 0.20], [0.40, -0.20], [-0.50, -0.35], [-0.50, 0.35]]"
      # footprint_model:
      #   type: "circular"                   # TEB 충돌 검사에 쓸 로봇 footprint 형태
      #   radius: 0.30                       # 로봇 반경. 좁은 통로와 장애물 회피 사이 절충

      free_goal_vel: false                 # goal에서 속도를 0으로 만들지 여부. false면 정지 도착

      min_obstacle_dist: 0.15              # TEB가 장애물과 유지하려는 최소 거리. 좁은 통로 통과성을 위해 완화
      inflation_dist: 0.28                 # 장애물 비용이 퍼지는 거리. 과도하게 막지 않으면서 조금 더 일찍 회피
      include_costmap_obstacles: true      # local costmap 장애물을 TEB 최적화에 포함
      costmap_obstacles_behind_robot_dist: 0.0 # 로봇 뒤쪽 장애물을 얼마나 볼지. 크면 후방 장애물도 제약이 됨
      obstacle_poses_affected: 10          # 장애물 하나가 trajectory pose 몇 개에 영향을 줄지. 더 멀리서 회피를 준비
      include_dynamic_obstacles: false     # 동적 장애물 예측 사용 여부. 현재 pointcloud costmap이면 false

      no_inner_iterations: 5               # TEB 내부 optimizer 반복 횟수
      no_outer_iterations: 5               # TEB 외부 optimizer 반복 횟수
      optimization_activate: true          # TEB 최적화 활성화
      optimization_verbose: false          # optimizer debug log 출력 여부
      penalty_epsilon: 0.05                # 제한값 근처에서 penalty가 부드럽게 걸리는 여유
      weight_max_vel_x: 2.0                # 최대 전진속도 제한을 얼마나 강하게 지킬지
      weight_max_vel_theta: 1.0            # 최대 회전속도 제한을 얼마나 강하게 지킬지
      weight_acc_lim_x: 5.0                # 전진 가속도 제한 비용
      weight_acc_lim_theta: 3.0            # 회전 가속도 제한 비용
      weight_kinematics_nh: 1000.0         # non-holonomic 제약. 옆으로 미끄러지는 해를 막음
      weight_kinematics_forward_drive: 2000.0 # 후진을 싫어하게 만드는 비용. 높을수록 전진 선호
      weight_kinematics_turning_radius: 1.0 # 최소 회전반경 관련 비용
      weight_optimaltime: 0.3              # 빠른 시간 궤적을 선호하는 정도. 높으면 급해질 수 있음
      weight_shortest_path: 0.0            # 짧은 경로 선호 비용
      weight_obstacle: 25.0                # 장애물 회피 비용. 회피는 유지하되 과도한 선회 완화
      weight_inflation: 3.0                # inflation 영역 비용. 장애물 주변 비용을 조금 더 일찍 반영
      weight_viapoint: 35.0                # 코너에서 중앙 경로를 더 강하게 따르도록 상향
      weight_adapt_factor: 2.0             # 반복 최적화 때 weight를 키우는 비율

      enable_homotopy_class_planning: false # 여러 우회 경로 후보를 동시에 탐색할지. false가 안정/가벼움
      enable_multithreading: true          # homotopy 사용 시 멀티스레드 여부
      max_number_classes: 4                # homotopy 경로 후보 최대 개수

      shrink_horizon_backup: true          # infeasible 시 horizon을 줄여 복구 시도
      shrink_horizon_min_duration: 2.0     # horizon 축소 복구를 유지하는 최소 시간
      oscillation_recovery: false           # 좌우 흔들림/진동 감지 시 복구 동작 활성화
      oscillation_recovery_min_duration: 2.0 # oscillation recovery를 최소 유지하는 시간
      oscillation_filter_duration: 3.0      # 최근 몇 초 움직임으로 oscillation을 판단할지
      
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0                # local costmap 계산 주기. 좁은 통로에서 과도한 갱신/마킹을 줄임
      publish_frequency: 2.0               # local costmap publish 주기
      transform_tolerance: 2.0             # TF 시간 오차 허용치
      transform_publish_period: 0.0        # 0.0이면 별도 주기 없이 최신 TF 사용
      global_frame: odom                   # local costmap 기준 frame. local 제어는 odom 기준이 안정적
      robot_base_frame: base_link          # 로봇 본체 frame
      use_sim_time: false
      rolling_window: true                 # 로봇 중심으로 costmap 창이 따라다님
      width: 3                             # local costmap 가로 크기 meter
      height: 3                            # local costmap 세로 크기 meter
      resolution: 0.05                     # costmap grid 해상도 meter/cell
      robot_radius: 0.30                   # Nav2 costmap에서 쓰는 로봇 반경
      plugins: ["stvl_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0           # 클수록 장애물 비용이 빨리 감소. 높이면 덜 보수적
        inflation_radius: 0.05             # 장애물 비용을 퍼뜨리는 반경. 좁은 통로 통과를 위해 축소
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true                      # 시간 decay가 있는 3D obstacle layer
        voxel_decay: 1.0                   # 장애물 잔상을 짧게 유지해서 뒤따르는 사람/노이즈 잔상을 줄임
        decay_model: 0                     # 0=linear, 1=exponential, -1=persistent
        voxel_size: 0.05                   # voxel을 키워 pointcloud obstacle 밀도를 낮춤
        track_unknown_space: false         # unknown space를 따로 막지 않음
        mark_threshold: 1                  # 유리처럼 희박한 포인트도 장애물로 반영
        update_footprint_enabled: false    # footprint 기반 clearing으로 유리 장애물이 지워지는 것을 방지
        combination_method: 1              # 1=max. 다른 layer와 cost를 보수적으로 결합
        origin_z: -0.3                     # voxel grid 시작 z 높이
        publish_voxel_map: true            # RViz 확인용 voxel map publish
        transform_tolerance: 0.2           # 센서 TF 허용 오차
        mapping_mode: false                # navigation용 local layer로 사용
        map_save_duration: 60.0
        observation_sources: body_cloud_mark
        body_cloud_mark:
          topic: /fastlio2/body_cloud      # local obstacle pointcloud
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_range: 1.5              # obstacle marking 최대 거리
          min_obstacle_height: 0.05        # 바닥 노이즈 제거용 최소 높이
          max_obstacle_height: 2.0         # 장애물로 볼 최대 높이
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 3
          clear_after_reading: true
        body_cloud_clear:
          topic: /fastlio2/body_cloud      # 같은 pointcloud로 frustum clearing 수행
          data_type: "PointCloud2"
          marking: false
          clearing: true
          min_z: 0.05
          max_z: 2.0
          vertical_fov_angle: 0.7
          vertical_fov_padding: 0.05
          horizontal_fov_angle: 6.29
          decay_acceleration: 1.0
          model_type: 1                    # 3D lidar 방식 clearing
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      transform_tolerance: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"] # "obstacle_layer",
      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: True
      #   observation_sources: scan
      #   scan:
      #     topic: /scan
      #     max_obstacle_height: 2.0
      #     clearing: True
      #     marking: True
      #     data_type: "LaserScan"
      #     raytrace_max_range: 3.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 2.5
      #     obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_topic: /map
        map_subscribe_transient_local: True
        subscribe_to_updates: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.80
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: "/home/nuc/ros2_ws/src/cango_master/maps/map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

